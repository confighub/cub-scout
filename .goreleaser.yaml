# GoReleaser configuration for cub-scout
# https://goreleaser.com

version: 2

project_name: cub-scout

# Keep GoReleaser outputs out of the repo-tracked `dist/` tree. This repo
# stores source templates and bundled scan artifacts under `dist/`, while
# GoReleaser's `release --clean` expects to own its output directory.
dist: .goreleaser-dist

before:
  hooks:
    - go mod tidy

builds:
  - id: cub-scout
    main: ./cmd/cub-scout
    binary: cub-scout
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.BuildTag={{.Version}}
      - -X main.BuildDate={{.Date}}
  - id: kubectl-cub-scout
    main: ./cmd/cub-scout
    binary: kubectl-cub_scout
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.BuildTag={{.Version}}
      - -X main.BuildDate={{.Date}}
  # Plugin build: same cub-scout source, compiled a second time under the
  # binary name `main` so the archive satisfies the `cub plugin install`
  # contract. cub extracts the release tar.gz into its plugin directory
  # and chmods `<plugin-dir>/main` to 0755 — so we must ship a file called
  # `main` at the archive root. See sdk/cmd/cub/plugin_install.go and
  # sdk/cmd/cub/plugin_exec.go for the authoritative contract.
  - id: cub-scout-plugin
    main: ./cmd/cub-scout
    binary: main
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.BuildTag={{.Version}}
      - -X main.BuildDate={{.Date}}

archives:
  # Default archive: one asset per OS+arch that serves every distribution
  # path at once.
  #
  #   * direct download / Homebrew: users run `cub-scout` from the archive
  #   * krew: users run `kubectl cub-scout` (via the kubectl-cub-scout build)
  #   * `cub plugin install confighub/cub-scout`: cub's asset matcher picks
  #     this tar.gz and extracts it into $CUB_CONFIG/plugins/scout/, where
  #     the `main` binary from the cub-scout-plugin build becomes the
  #     plugin entry point. Shipping `cub-scout` and `main` in the same
  #     archive means cub's asset ordering cannot pick a plugin-unfriendly
  #     asset.
  #
  # Windows is served by the default archive only. `cub-scout-plugin` does
  # not build for windows because the cub plugin exec path uses syscall.Exec
  # which does not exist on windows.
  - id: default
    ids:
      - cub-scout
      - kubectl-cub-scout
      - cub-scout-plugin
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CLI-GUIDE.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

# Note: brews and dockers use deprecated syntax but still work
# Will be updated when GoReleaser v2 stabilizes new API

brews:
  - name: cub-scout
    repository:
      owner: confighub
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://confighub.com"
    description: "Explore and map GitOps in your clusters"
    license: "MIT"
    install: |
      bin.install "cub-scout"
      bin.install "kubectl-cub_scout"
    test: |
      system "#{bin}/cub-scout", "version"
      system "#{bin}/kubectl-cub_scout", "version"

dockers:
  - image_templates:
      - "ghcr.io/confighub/cub-scout:{{ .Tag }}"
      - "ghcr.io/confighub/cub-scout:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
