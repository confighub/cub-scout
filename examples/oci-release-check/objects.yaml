apiVersion: v1
kind: ConfigMap
metadata:
  name: api-settings
  namespace: delivery
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example.invalid/api:v1
          envFrom:
            - configMapRef:
                name: api-settings
