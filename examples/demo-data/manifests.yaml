# ============================================================
# Flux Sources
# ============================================================
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-apps
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/acme-corp/platform-apps
  ref:
    branch: main
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: confighub-bundles
  namespace: flux-system
  labels:
    confighub.com/SpaceName: acme-platform
    confighub.com/UnitSlug: confighub-bundles
spec:
  interval: 5m
  url: oci://registry.confighub.com/acme-corp/bundles
  ref:
    tag: latest
---

