# demo-data: App-Deployment-Target manifests
#
# 6 apps x 2 targets = 12 Deployments + 12 Services
# Plus Flux source/deployer resources for bridge pattern detection.
#
# Labels:
#   confighub.com/UnitSlug     — ConfigHub unit identity
#   confighub.com/SpaceName    — ConfigHub space (app-target)
#   confighub.com/App          — application name
#   confighub.com/AppOwner     — owning team
#   confighub.com/TargetRole   — target role (production)
#   confighub.com/TargetRegion — target region
#
# Intentional version skew: eshop-api:4.2.1 (us-prod) vs eshop-api:4.2.0 (eu-prod)
#
# Usage:
#   kubectl apply -f examples/demo-data/manifests.yaml
#   cub-scout scan --file examples/demo-data/manifests.yaml
#   cub-scout map workloads
#   cub-scout patterns detect

