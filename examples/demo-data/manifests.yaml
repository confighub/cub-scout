# ============================================================
# Workloads — US-PROD
# ============================================================

# --- aichat (us-prod) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aichat-api
  namespace: us-prod-aichat
  labels:
    app: aichat-api
    confighub.com/UnitSlug: aichat-us-prod
    confighub.com/SpaceName: us-prod-aichat
    confighub.com/App: aichat
    confighub.com/AppOwner: ai-team
    confighub.com/TargetRole: production
    confighub.com/TargetRegion: us-east-1
    kustomize.toolkit.fluxcd.io/name: us-prod-aichat
    kustomize.toolkit.fluxcd.io/namespace: flux-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aichat-api
  template:
    metadata:
      labels:
        app: aichat-api
    spec:
      containers:
        - name: api
          image: registry.acme.com/aichat-api:2.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: LOG_LEVEL
              value: warn
            - name: REGION
              value: us-east-1
---
apiVersion: v1
kind: Service
metadata:
  name: aichat-api
  namespace: us-prod-aichat
  labels:
    confighub.com/UnitSlug: aichat-us-prod
    confighub.com/SpaceName: us-prod-aichat
    confighub.com/App: aichat
    kustomize.toolkit.fluxcd.io/name: us-prod-aichat
    kustomize.toolkit.fluxcd.io/namespace: flux-system
spec:
  selector:
    app: aichat-api
  ports:
    - port: 80
      targetPort: 8080
---

