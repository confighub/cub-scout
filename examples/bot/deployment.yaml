apiVersion: apps/v1
kind: Deployment
metadata:
  name: cub-scout-bot
  namespace: cub-scout
  labels:
    app.kubernetes.io/name: cub-scout-bot
    app.kubernetes.io/part-of: cub-scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cub-scout-bot
      app.kubernetes.io/part-of: cub-scout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cub-scout-bot
        app.kubernetes.io/part-of: cub-scout
    spec:
      serviceAccountName: cub-scout-bot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cub-scout
          image: ghcr.io/confighub/cub-scout:v3.0.0
          imagePullPolicy: IfNotPresent
          args: ["bot", "--watch-backed"]
          env:
            # Required sink: webhook URL to receive JSON watch/bot events.
            - name: CUB_SCOUT_BOT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: cub-scout-bot-webhook
                  key: url
            # Polling interval between observation cycles (Go duration, e.g. 30s, 1m).
            - name: CUB_SCOUT_BOT_INTERVAL
              value: "30s"
            # Optional namespace scope. Leave empty to observe all namespaces.
            - name: CUB_SCOUT_BOT_NAMESPACE
              value: ""
            - name: CUB_SCOUT_BOT_SEVERITY
              value: "warning,critical"
            - name: CUB_SCOUT_BOT_MAX_QUEUED_EVENTS
              value: "1000"
            - name: CUB_SCOUT_BOT_EMIT_RECEIPT_ON
              value: "all"
            - name: CUB_SCOUT_BOT_EMIT_RECEIPT_BATCH_CAP
              value: "10"
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
