apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-tree-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: examples/delivery-tree/argocd/workloads/web
  destination:
    server: https://kubernetes.default.svc
    namespace: delivery-tree-web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
