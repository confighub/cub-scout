  - source_line: 1
    text: "# Run log: bootstrapped handover, 2026-09-30"
  - source_line: 2
    text: ""
  - source_line: 3
    text: "A fleet set up the way `flux bootstrap` sets it up, handed over to ConfigHub"
  - source_line: 4
    text: "through the root, and handed back. Kept as a record of what was run and seen."
  - source_line: 5
    text: ""
  - source_line: 6
    text: "- **Flux:** v2.8.6 on kind, cluster `rh-boot`."
  - source_line: 7
    text: "- **ConfigHub:** v0.6.8, self-hosted, gateway over plain HTTP. `cub` v0.6.8."
  - source_line: 8
    text: "- **Fleet:** this repository's `gitops/flux/beginner`, served by a lab Git server the cluster reads and the test pushes to."
  - source_line: 9
    text: "- **Bootstrap:** `clusters/dev/flux-system/` holds `gotk-components.yaml` (from `flux install --export`) and a `gotk-sync.yaml`. So the `flux-system` Kustomization applies `clusters/dev/` from that server, and owns both layers."
  - source_line: 10
    text: "- **Output:** trimmed to the lines that matter; the digests and SHAs are the real ones."
