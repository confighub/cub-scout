# CI Workflow for cub-scout
#
# Runs tests at multiple levels:
# - Level 0 (smoke): Always runs, fast
# - Level 1 (unit): Always runs, all Go tests
# - Level 2 (integration): Needs cluster, basic commands
# - Level 3 (gitops): Needs Flux + ArgoCD, ownership detection
# - Level 6 (connected): Needs ConfigHub auth, import round-trip
#
# See test/test-levels.yaml for level definitions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: 'Test level (smoke, unit, integration, gitops, demos, connected, full)'
        required: false
        default: 'integration'

jobs:
  # ==========================================================================
  # Level 0 + 1: Smoke + Unit (no cluster needed)
  # ==========================================================================
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    outputs:
      coverage_total: ${{ steps.coverage_metric.outputs.coverage_total }}
      coverage_min: ${{ steps.coverage_metric.outputs.coverage_min }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Run govulncheck
        continue-on-error: true  # Informational for now - stdlib vulns need Go upgrade
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Check read-only policy
        run: ./scripts/check-readonly.sh

      - name: Run unit tests
        run: go test ./... -v -covermode=atomic -coverprofile=coverage.out

      - name: Enforce coverage gate
        run: ./scripts/ci/check-coverage.sh coverage.out
        env:
          COVERAGE_MIN_PERCENT: "25.0"

      - name: Capture coverage metric
        id: coverage_metric
        run: |
          total="$(awk '/^total:/{gsub("%","",$3); print $3}' coverage-summary.txt)"
          if [[ -z "${total}" ]]; then
            echo "failed to extract total coverage from coverage-summary.txt" >&2
            exit 1
          fi
          echo "coverage_total=${total}" >> "$GITHUB_OUTPUT"
          echo "coverage_min=25.0" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-summary.txt

      - name: Verify real examples catalog
        run: go test -tags=integration ./test/integration/... -run '^TestRealExamplesCatalog$' -count=1 -v

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cub-scout-linux
          path: cub-scout

  # ==========================================================================
  # Level 2: Integration (needs cluster)
  # ==========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster

      - name: Build binary for golden tests
        run: go build ./cmd/cub-scout

      - name: Run integration tests
        run: go test -tags=integration ./test/integration/... -v

      - name: Run E2E tests (internal model + cluster)
        run: go test -tags=e2e ./cmd/cub-scout/... -v -timeout 120s

      - name: Run cluster-dependent golden tests
        run: go test ./test/golden/... -count=1 -v

      - name: Test map commands
        run: |
          ./cub-scout map status
          ./cub-scout map list
          ./cub-scout map list --json | head -20
          ./cub-scout scan

  # ==========================================================================
  # Level 3: GitOps E2E (needs Flux + ArgoCD)
  # ==========================================================================
  gitops:
    name: GitOps E2E
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: gitops-cluster

      - name: Install Flux
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux install

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd || true
          # Use server-side apply to avoid oversized last-applied annotations on Argo CRDs.
          kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=180s

      - name: Deploy Flux example
        run: |
          kubectl apply -f examples/flux-boutique/boutique.yaml
          sleep 30  # Wait for Flux to reconcile
          kubectl wait --for=condition=available deployment --all -n boutique --timeout=120s || true

      - name: Deploy ArgoCD example
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: guestbook
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/argoproj/argocd-example-apps.git
              targetRevision: HEAD
              path: guestbook
            destination:
              server: https://kubernetes.default.svc
              namespace: guestbook
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
          EOF
          sleep 30  # Wait for ArgoCD to sync

      - name: Verify Flux ownership detection
        run: |
          echo "=== All resources ==="
          ./cub-scout map list

          echo "=== Flux resources ==="
          ./cub-scout map list | grep flux || echo "No flux resources (may still be syncing)"

          echo "=== Deployers ==="
          ./cub-scout map deployers

      - name: Verify ArgoCD ownership detection
        run: |
          ./cub-scout map list | grep argo || echo "ArgoCD resources may still be syncing"

      - name: Test trace command
        run: |
          ./cub-scout trace deployment/cart -n boutique || echo "Trace may fail if resources not ready"

      - name: Test deep-dive
        run: ./cub-scout map deep-dive | head -80

      - name: Test app-hierarchy
        run: ./cub-scout map app-hierarchy | head -80

  # ==========================================================================
  # Level 4: Demos (optional, manual trigger)
  # ==========================================================================
  demos:
    name: Demo Tests
    runs-on: ubuntu-latest
    needs: gitops
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'demos' || github.event.inputs.level == 'full'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: demo-cluster

      - name: Install Flux
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux install

      - name: Run quick demo
        run: |
          ./cub-scout demo quick
          ./cub-scout demo quick --cleanup

      - name: Run ccve demo
        run: |
          ./cub-scout demo ccve
          ./cub-scout demo ccve --cleanup

      - name: Run query demo
        run: |
          ./cub-scout demo query
          ./cub-scout demo query --cleanup

      - name: Run scenarios
        run: |
          ./cub-scout demo scenario bigbank-incident || true
          ./cub-scout demo scenario bigbank-incident --cleanup || true
          ./cub-scout demo scenario break-glass || true
          ./cub-scout demo scenario break-glass --cleanup || true

  # ==========================================================================
  # Level 6: Connected E2E (needs ConfigHub auth, manual trigger)
  # ==========================================================================
  connected:
    name: Connected E2E
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.level == 'connected' || github.event.inputs.level == 'full')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: connected-cluster

      - name: Authenticate to ConfigHub
        if: env.CUB_AUTH_TOKEN != ''
        run: |
          echo "$CUB_AUTH_TOKEN" | cub auth login --token -
        env:
          CUB_AUTH_TOKEN: ${{ secrets.CUB_AUTH_TOKEN }}

      - name: Run import dry-run tests
        run: go test -tags=integration ./test/integration/... -run 'TestImportDryRun' -v -timeout 120s

      - name: Run import round-trip tests
        if: env.CUB_AUTH_TOKEN != ''
        run: go test -tags=integration ./test/integration/... -run 'TestImportFull|TestImportIdempotent|TestImportCleanup' -v -timeout 300s
        env:
          CUB_AUTH_TOKEN: ${{ secrets.CUB_AUTH_TOKEN }}

  # ==========================================================================
  # Proof artifact (always publish run matrix)
  # ==========================================================================
  proof-artifact:
    name: Proof Artifact
    runs-on: ubuntu-latest
    needs:
      - unit
      - integration
      - gitops
      - demos
      - connected
      - full
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Emit proof artifact
        run: ./scripts/ci/emit-proof-artifact.sh ./proof-artifact
        env:
          PROOF_UNIT: ${{ needs.unit.result }}
          PROOF_INTEGRATION: ${{ needs.integration.result }}
          PROOF_GITOPS: ${{ needs.gitops.result }}
          PROOF_DEMOS: ${{ needs.demos.result }}
          PROOF_CONNECTED: ${{ needs.connected.result }}
          PROOF_FULL: ${{ needs.full.result }}
          PROOF_COVERAGE_TOTAL: ${{ needs.unit.outputs.coverage_total }}
          PROOF_COVERAGE_MIN: ${{ needs.unit.outputs.coverage_min }}

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-proof-artifact
          path: ./proof-artifact

  # ==========================================================================
  # Full test (manual trigger only)
  # ==========================================================================
  full:
    name: Full Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'full'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: full-test-cluster

      - name: Run prove-it-works
        run: ./test/prove-it-works.sh --level=full
