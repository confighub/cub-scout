# CI Workflow for cub-scout
#
# Runs tests at multiple levels:
# - Level 0 (smoke): Always runs, fast
# - Level 1 (unit): Always runs, all Go tests
# - Level 2 (integration): Needs cluster, basic commands
# - Level 3 (gitops): Needs Flux + ArgoCD, ownership detection
# - Level 6 (connected): Needs ConfigHub auth, import round-trip
#
# See test/test-levels.yaml for level definitions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: 'Test level (smoke, unit, integration, gitops, demos, connected, live-status, modelplane, attach, windows, full)'
        type: choice
        options: [smoke, unit, integration, gitops, demos, connected, live-status, modelplane, attach, windows, full]
        required: false
        default: 'integration'

# Every job names its runner image, kind and node image. On 2026-11-16
# ubuntu-latest moved to 26.04 unannounced to this repository and broke the
# live-status lane; nothing here should move without a commit that says so.
# kind v0.31.0 and kindest/node v1.35.0 were what helm/kind-action@v1
# installed by default when they were pinned. On 2026-11-19 they moved, on
# purpose, to kind v0.33.0 and node v1.35.8 (kind v0.33.0's image for that
# minor): the same Kubernetes minor, so the client libraries' skew is unchanged.
jobs:
  # ==========================================================================
  # Level 0 + 1: Smoke + Unit (no cluster needed)
  # ==========================================================================
  unit:
    name: Unit Tests
    runs-on: ubuntu-26.04
    outputs:
      coverage_total: ${{ steps.coverage_metric.outputs.coverage_total }}
      coverage_min: ${{ steps.coverage_metric.outputs.coverage_min }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Run golangci-lint
        # Pinned: golangci-lint must be built with a Go at least as new as
        # go.mod's go directive, and .golangci.yml is the v2 schema.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Run govulncheck
        continue-on-error: true  # Informational for now - stdlib vulns need Go upgrade
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Check read-only policy
        run: ./scripts/check-readonly.sh

      - name: Check CLI guide parity
        run: ./scripts/check-cli-guide-parity.sh

      - name: Check no personal names in committed files
        run: ./scripts/check-no-personal-names.sh

      - name: Verify release hook inputs and ignored output
        run: |
          go mod tidy -diff
          git check-ignore -q .goreleaser-dist/rehearsal.tmp

      - name: Verify genuine governance capture packet
        run: python3 scripts/ci/test_governance_capture.py

      - name: Verify genuine revision-chain and claim coverage packet
        run: python3 scripts/ci/test_governance_revision_chain.py

      - name: Verify genuine restricted-viewer claim capture
        run: python3 scripts/ci/test_attestation_viewer_capture.py

      - name: Verify genuine Helm lifecycle capture packet
        run: python3 scripts/ci/test_helm_lifecycle_capture.py

      - name: Verify accepted native Windows runtime receipts
        run: python3 scripts/ci/test_windows_runtime_capture.py

      - name: Verify retained Python substrate execution checkpoint
        run: python3 scripts/ci/test_python_substrate_capture.py

      - name: Test required acceptance control flow
        run: python3 scripts/ci/test_prove_it_works.py

      - name: Test connected CI provisioning and required outcomes
        run: python3 scripts/ci/test_connected_ci.py

      - name: Run offline eval trace admission tests
        run: python3 evals/scripts/test_admission_audit.py

      - name: Run offline direct CLI control guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/direct-cli-controls -v

      - name: Run combined recorded runtime receipt contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/combined-recorded-runtime -v

      - name: Run offline HLT-04 replay guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/sveltos-hlt-04-report-freshness -p 'test_*.py' -v

      - name: Run offline RUL-04 capture guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest evals/rul04-image-identity/test_capture.py

      - name: Run offline doctor scan context proof guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/doctor-scan-context -p 'test_*.py' -v

      - name: Run offline before-attach eval case checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/before-attach-wired-cluster -p 'test_*.py' -v

      - name: Run Trace MCP recorded evidence guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/trace-context-binding -p 'test_*.py' -v

      - name: Run offline Trace owned context proof guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/trace-context-live -p 'test_*.py' -v

      - name: Run offline three-way owned context proof guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/three-way-context-live -p 'test_*.py' -v

      - name: Run Trace case-sensitive identity fixture guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/trace-case-sensitive-slugs -p 'test_*.py' -v

      - name: Run offline watch cache namespace proof guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest evals/watch-cache-namespace/test_capture.py -v

      - name: Run offline RUL-01 dated-snapshot guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/rul01-dated-snapshot -v

      - name: Run offline PRE-01 capture guards
        run: |
          python3 -m venv /tmp/scout-pre01-ci
          /tmp/scout-pre01-ci/bin/python -m pip install -r evals/pre01-crd/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/pre01-crd -v

      - name: Run offline full-24 paired source preflight guards
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/full24-pair-preflight -v

      - name: Run offline full-24 selected-case staging guards
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/full24-case-stage -v

      - name: Run offline full-24 case isolation runtime guards
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/full24-case-isolation -v

      - name: Check offline workflow selection
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s scripts/ci -p 'test_offline_workflow.py' -v

      - name: Run offline source-bound launch policy guards
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/full24-launch-policy -v

      - name: Run offline Explain explicit-context answer controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/explain-explicit-context -v

      - name: Run offline ChangeOrder read-contract answer controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/changeorder-read-contract -v

      - name: Run existing strict recorded-scale answer controls
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/recorded-scale -p 'test_packet.py' -k test_strict_answer_contract_is_opt_in_and_hashes_generated_files -v

      - name: Run offline PRE-01 recorded API replay guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/recorded-api -v

      - name: Run offline recorded typed-list answer controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/recorded-typed-list -v

      - name: Run offline Sveltos controller-fact answer controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/sveltos-controller-facts -v

      - name: Run offline PRE-01 real-kubectl gate guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/pre01-real-kubectl -v

      - name: Run offline Linux runtime version gate guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest evals/linux-runtime-versions/test_prepare.py

      - name: Run offline RUL-03 capture and fixture-routing guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/rul03-context -v

      - name: Run offline legacy strict-answer packet guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/legacy-strict-cases -v

      - name: Run offline PRE-02 capture and fixture-routing guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/pre02-node-selector -v

      - name: Run offline container isolation guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/container-isolation -v

      - name: Validate recorded report schemas and actual offline budgets
        run: |
          python3 -m venv "$RUNNER_TEMP/scout-recorded-schema"
          "$RUNNER_TEMP/scout-recorded-schema/bin/pip" install --disable-pip-version-check -r examples/recorded-inventory/schema-requirements.txt
          go build -o "$RUNNER_TEMP/scout-recorded-schema/cub-scout" ./cmd/cub-scout
          "$RUNNER_TEMP/scout-recorded-schema/bin/python" examples/recorded-inventory/verify-output-contract.py --binary "$RUNNER_TEMP/scout-recorded-schema/cub-scout"

      - name: Run unit tests
        run: go test ./... -v -covermode=atomic -coverprofile=coverage.out

      - name: Enforce coverage gate
        run: ./scripts/ci/check-coverage.sh coverage.out
        env:
          COVERAGE_MIN_PERCENT: "25.0"

      - name: Capture coverage metric
        id: coverage_metric
        run: |
          total="$(awk '/^total:/{gsub("%","",$3); print $3}' coverage-summary.txt)"
          if [[ -z "${total}" ]]; then
            echo "failed to extract total coverage from coverage-summary.txt" >&2
            exit 1
          fi
          echo "coverage_total=${total}" >> "$GITHUB_OUTPUT"
          echo "coverage_min=25.0" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-summary.txt

      - name: Verify external observation example
        run: python3 -m unittest discover -s examples/fleet-by-orchestration -v

      - name: Verify real examples catalog
        run: go test -tags=integration ./test/integration/... -run '^TestRealExamplesCatalog$' -count=1 -v

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cub-scout-linux
          path: cub-scout

  # ==========================================================================
  # Manual native Windows release runtime admission
  # ==========================================================================
  windows-runtime:
    name: Windows Release Runtime (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.level == 'windows' || github.event.inputs.level == 'full')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            asset: goreleaser_Windows_x86_64.zip
            sha256: de61a8e7a064abb14210b16c942facd299643d83341c5cd293f19155a7c8b95f
          - arch: arm64
            runner: windows-11-arm
            asset: goreleaser_Windows_arm64.zip
            sha256: d2aebc59bee96078c1f529160f170e02ffc96fd5d31b5e33eef66cdd7256f602
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Preserve canonical source line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.arch }}
      - name: Verify canonical native build inputs
        shell: pwsh
        run: |
          python scripts/ci/verify_windows_release_runtime.py --preflight --arch '${{ matrix.arch }}' --source '${{ github.sha }}' --output '${{ runner.temp }}/scout-windows-proof/source-inputs.json'
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows source input proof failed' }
      - name: Build configured native Windows release binaries
        shell: pwsh
        env:
          GORELEASER_CURRENT_TAG: v2.13.0
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          GOTOOLCHAIN: local
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP '${{ matrix.asset }}'
          $tools = Join-Path $env:RUNNER_TEMP 'scout-goreleaser'
          $proof = Join-Path $env:RUNNER_TEMP 'scout-windows-proof'
          New-Item -ItemType Directory -Force $proof | Out-Null
          Invoke-WebRequest 'https://github.com/goreleaser/goreleaser/releases/download/v2.18.2/${{ matrix.asset }}' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ matrix.sha256 }}') { throw 'GoReleaser checksum mismatch' }
          Expand-Archive $archive -DestinationPath $tools
          & (Join-Path $tools 'goreleaser.exe') build --snapshot --clean --single-target --id cub-scout --id kubectl-cub-scout --parallelism 2 --timeout 15m 2>&1 | Tee-Object -FilePath (Join-Path $proof 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Configured Windows build failed' }
      - name: Verify native source identity and runtime
        shell: pwsh
        run: |
          python scripts/ci/verify_windows_release_runtime.py --arch '${{ matrix.arch }}' --source '${{ github.sha }}' --output '${{ runner.temp }}/scout-windows-proof/runtime.json'
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows runtime proof failed' }
      - name: Retain native release runtime proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/scout-windows-proof/
            .goreleaser-dist/metadata.json
            .goreleaser-dist/cub-scout_windows_*/cub-scout.exe
            .goreleaser-dist/kubectl-cub-scout_windows_*/kubectl-cub_scout.exe

  integration:
    name: Integration Tests
    runs-on: ubuntu-26.04
    needs: unit
    # Manual smoke/unit runs must not create a cluster. Unknown manual levels
    # also fail closed to offline jobs. Normal PR/main runs retain live CI.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.level == 'integration' || github.event.inputs.level == 'gitops' || github.event.inputs.level == 'demos' || github.event.inputs.level == 'connected' || github.event.inputs.level == 'live-status' || github.event.inputs.level == 'modelplane' || github.event.inputs.level == 'attach' || github.event.inputs.level == 'full'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: test-cluster

      - name: Build binary for golden tests
        run: go build ./cmd/cub-scout

      - name: Run integration tests
        run: go test -tags=integration ./test/integration/... -v

      - name: Run E2E tests (internal model + cluster)
        run: scripts/ci/e2e-test-budget.sh

      - name: Run cluster-dependent golden tests
        run: go test -tags=integration ./test/golden/... -count=1 -v

      - name: Test map commands
        run: |
          map_status_exit=0
          ./cub-scout map status || map_status_exit=$?
          if [ "$map_status_exit" -gt 1 ]; then
            echo "map status failed with unexpected exit code $map_status_exit"
            exit "$map_status_exit"
          fi
          ./cub-scout map list
          ./cub-scout map list --json | head -20
          ./cub-scout scan

  # ==========================================================================
  # Level 3: GitOps E2E (needs Flux + ArgoCD)
  # ==========================================================================
  gitops:
    name: GitOps E2E
    runs-on: ubuntu-26.04
    needs: integration
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: gitops-cluster
          # A local registry on the kind network, for the release-check lane.
          registry: true

      - name: Install pinned GitOps controllers
        run: bash scripts/ci/setup-gitops-controllers.sh

      - name: Deploy Flux example
        run: |
          kubectl apply -f examples/flux-boutique/boutique.yaml
          kubectl wait --for=condition=Ready gitrepository/boutique -n boutique --timeout=300s
          for name in frontend cart checkout payment shipping; do
            kubectl wait --for=condition=Ready "kustomization/$name" -n boutique --timeout=300s
            kubectl rollout status "deployment/$name" -n boutique --timeout=300s
          done

      # The answer block on explain, on a real Flux-managed Deployment.
      - name: explain answers on a real Flux install
        run: |
          ./cub-scout explain deployment/frontend -n boutique --format json > explain-frontend.json
          jq -e '.answer.state == "explained" and .answer.reason == "owner-and-chain-read"' explain-frontend.json \
            || { jq '.answer' explain-frontend.json; exit 1; }
          jq -c '.answer | {state, reason, summary}' explain-frontend.json

      - name: gitops settings answers on a real Flux install
        run: |
          ./cub-scout gitops settings --kube-context kind-gitops-cluster --format json --view summary > settings.json
          jq -e '.answer.state == "listed" and .answer.reason == "settings-read" and .answer.cluster.context == "kind-gitops-cluster" and .answer.cost.requestsMade > 0' settings.json \
            || { jq '.answer' settings.json; exit 1; }
          jq -c '.answer | {state, reason, summary, requests: .cost.requestsMade}' settings.json

      - name: Deploy ArgoCD example
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: guestbook
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/argoproj/argocd-example-apps.git
              targetRevision: HEAD
              path: guestbook
            destination:
              server: https://kubernetes.default.svc
              namespace: guestbook
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
          EOF
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced application/guestbook -n argocd --timeout=300s
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy application/guestbook -n argocd --timeout=300s
          kubectl rollout status deployment/guestbook-ui -n guestbook --timeout=300s

      # The answer block on gitops status, on real Flux objects that were just
      # waited Ready: it must say settled, and count the reads it made.
      - name: gitops status answers on a real Flux install
        run: |
          ./cub-scout gitops status -n boutique --format json > gitops-status-boutique.json
          jq -e '.answer.state == "settled" and .answer.reason == "deployers-report-ready" and .answer.cost.requestsMade > 0 and .answer.cost.coverage == "gitops-status-session-clients"' gitops-status-boutique.json \
            || { jq '.answer' gitops-status-boutique.json; exit 1; }
          jq -c '.answer | {state, reason, summary, requestsMade: .cost.requestsMade}' gitops-status-boutique.json

      # A three-level app-of-apps read from this commit, so that what Argo CD
      # reports for each level is recorded from a real controller (#855).
      - name: Deploy the delivery-tree example
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sed -e "s|REPO_URL|https://github.com/${GITHUB_REPOSITORY}.git|" -e "s|REVISION|${REVISION}|" \
            examples/delivery-tree/argocd/root-application.yaml | kubectl apply -f -
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced application/delivery-tree -n argocd --timeout=300s
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced application/delivery-tree-team-a -n argocd --timeout=300s
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced application/delivery-tree-web -n argocd --timeout=300s
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy application/delivery-tree-web -n argocd --timeout=300s
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced application/delivery-tree-jobs -n argocd --timeout=300s
          kubectl wait --for=jsonpath='{.status.sync.status}'=OutOfSync application/delivery-tree-team-b -n argocd --timeout=300s
          kubectl wait --for=jsonpath='{.status.conditions[0].type}'=ComparisonError application/delivery-tree-broken -n argocd --timeout=300s
          kubectl get application delivery-tree-elsewhere -n delivery-tree-elsewhere-apps
          kubectl get applications.argoproj.io -A -o json > "$RUNNER_TEMP/argo-delivery-tree.json"
          kubectl get applications.argoproj.io -A

      # gitops tree, held to what this Argo CD has just done with the example.
      - name: Verify gitops tree on the delivery-tree example
        run: |
          ./cub-scout gitops tree app/delivery-tree
          ./cub-scout gitops tree app/delivery-tree --format json > "$RUNNER_TEMP/scout-delivery-tree.json"
          tree="$RUNNER_TEMP/scout-delivery-tree.json"
          jq -e '.complete == true' "$tree"
          jq -e '.summary | .roots == 1 and .deployers == 8 and .resources == 8 and .maxDepth == 2 and .notFound == 1 and .notReconciled == 1 and .noneReported == 2' "$tree"
          jq -e '.roots[0] | .name == "delivery-tree" and .state.sync == "Synced" and ([.policies[] | "\(.name)=\(.value)"] == ["auto-sync=on","self-heal=on","prune=on"])' "$tree"
          jq -e '[.roots[0].children.deployers[].name] == ["delivery-tree-broken","delivery-tree-team-a","delivery-tree-team-b","delivery-tree-elsewhere"]' "$tree"
          jq -e '[.roots[0].children.resources[] | "\(.kind)/\(.name)"] == ["ConfigMap/platform-settings","Namespace/delivery-tree-elsewhere-apps","Namespace/delivery-tree-platform"]' "$tree"
          # The root's ignore rule is on each child Application it names.
          jq -e '[.roots[0].children.deployers[].reportedByParent.ignoredByParent[0].jsonPointers[0]] == ["/spec/syncPolicy","/spec/syncPolicy","/spec/syncPolicy","/spec/syncPolicy"]' "$tree"
          jq -e '.roots[0].children.deployers[] | select(.name == "delivery-tree-team-a") | [.children.deployers[].name] == ["delivery-tree-jobs","delivery-tree-web"]' "$tree"
          jq -e '.roots[0].children.deployers[] | select(.name == "delivery-tree-team-a") | .children.deployers[] | select(.name == "delivery-tree-web") | [.children.resources[] | "\(.kind)/\(.namespace)/\(.name)/\(.sync)"] == ["ConfigMap/delivery-tree-web/web-settings/Synced","Deployment/delivery-tree-web/web/Synced","Service/delivery-tree-web/web/Synced"]' "$tree"
          # Never synced: it reports the Application it would create, which is not there.
          jq -e '.roots[0].children.deployers[] | select(.name == "delivery-tree-team-b") | .state.sync == "OutOfSync" and (.children.deployers | length == 1) and .children.deployers[0].name == "delivery-tree-api" and .children.deployers[0].object == "not_found" and .children.deployers[0].reportedByParent.sync == "OutOfSync"' "$tree"
          # Could not be compared, and not reconciled at all: neither is "nothing under it".
          jq -e '.roots[0].children.deployers[] | select(.name == "delivery-tree-broken") | .children.status == "none_reported" and .state.conditions[0].type == "ComparisonError"' "$tree"
          jq -e '.roots[0].children.deployers[] | select(.name == "delivery-tree-elsewhere") | .object == "found" and .state.reconciled == false and .children.status == "none_reported"' "$tree"
          # No resource health: Argo CD 3 does not put it on the Application.
          jq -e '[.. | objects | select(has("kind") and has("sync") and (has("controller") | not)) | has("health")] | (length >= 8) and (any | not)' "$tree"
          ./cub-scout gitops tree app/delivery-tree --kind Deployment | tee "$RUNNER_TEMP/scout-delivery-tree-deployments.txt"
          grep -q 'Deployment delivery-tree-web/web' "$RUNNER_TEMP/scout-delivery-tree-deployments.txt"
          if grep -q 'ConfigMap' "$RUNNER_TEMP/scout-delivery-tree-deployments.txt"; then echo 'a ConfigMap passed --kind Deployment' >&2; exit 1; fi
          # Out of sync: team-b and the Application it would create. The two that report nothing are kept
          # too, since what is under them was not seen; team-a and its Applications, all Synced, are not.
          ./cub-scout gitops tree app/delivery-tree --sync OutOfSync --format json | jq -e '.shown.deployers == 5 and ([.roots[0].children.deployers[].name] == ["delivery-tree-broken","delivery-tree-team-b","delivery-tree-elsewhere"]) and .roots[0].children.deployers[1].children.deployers[0].name == "delivery-tree-api" and .roots[0].children.hiddenByFilter == 4'
          # Every root: the example's and the guestbook above; a deployer in the middle is not a root.
          ./cub-scout gitops tree --format json --view summary > "$RUNNER_TEMP/scout-delivery-tree-summary.json"
          jq -e '[.tree[].deployer] | index("Application argocd/delivery-tree") != null and index("Application argocd/guestbook") != null and index("Application argocd/delivery-tree-team-a") == null' "$RUNNER_TEMP/scout-delivery-tree-summary.json"
          ./cub-scout gitops tree app/delivery-tree --format md > "$RUNNER_TEMP/scout-delivery-tree.md"
          grep -q '^# Delivery tree: Application/delivery-tree' "$RUNNER_TEMP/scout-delivery-tree.md"
          # A deployer that is not there is an error, not an empty tree.
          if ./cub-scout gitops tree app/no-such-application 2> "$RUNNER_TEMP/scout-delivery-tree-missing.txt"; then echo 'a missing deployer was not an error' >&2; exit 1; fi
          grep -q 'no deployer Application/no-such-application was found' "$RUNNER_TEMP/scout-delivery-tree-missing.txt"

      # The answer block on doctor, on a real cluster: one of the decided
      # state words, the context it read, and a time.
      - name: doctor answers on a real cluster
        run: |
          ./cub-scout doctor -n boutique --format json > doctor-boutique.json
          jq -e '(.answer.state | IN("issues-flagged","nothing-flagged","incomplete","not-observable")) and .answer.cluster.context == "kind-gitops-cluster" and (.answer.observedAt | length > 0) and (.answer.unknowns | type == "array")' doctor-boutique.json \
            || { jq '.answer' doctor-boutique.json; exit 1; }
          jq -c '.answer | {state, reason, summary}' doctor-boutique.json

      # The answer block on map list's object forms, on a real cluster.
      - name: map list answers on a real cluster
        run: |
          ./cub-scout map list --namespace boutique --summary --format json > map-boutique.json
          jq -e '.answer.state == "listed" and .answer.reason == "inventory-listed" and .total > 0' map-boutique.json \
            || { jq '.answer' map-boutique.json; exit 1; }
          jq -c '.answer | {state, reason, summary}' map-boutique.json

      - name: scan answers on a real cluster
        run: |
          ./cub-scout scan --kube-context kind-gitops-cluster -n boutique --json > scan-boutique.json
          jq -e '(.answer.state | IN("findings","no-findings","incomplete","not-observable")) and .answer.cluster.context == "kind-gitops-cluster" and .kubernetesContext == "kind-gitops-cluster" and .answer.cost.coverage == "scan-session-clients" and .answer.cost.requestsMade > 0' scan-boutique.json \
            || { jq '.answer' scan-boutique.json; exit 1; }
          jq -c '.answer | {state, reason, summary, requests: .cost.requestsMade}' scan-boutique.json

      - name: Verify Flux ownership detection
        run: |
          ./cub-scout map list --json --namespace boutique > "$RUNNER_TEMP/flux-ownership.json"
          for name in frontend cart checkout payment shipping; do
            jq -e --arg name "$name" '[.[] | select(.namespace == "boutique" and .kind == "Deployment" and .name == $name and .owner == "Flux")] | length == 1' "$RUNNER_TEMP/flux-ownership.json"
          done
          ./cub-scout map deployers

      - name: Verify ArgoCD ownership detection
        run: |
          ./cub-scout map list --json --namespace guestbook > "$RUNNER_TEMP/argo-ownership.json"
          jq -e '[.[] | select(.namespace == "guestbook" and .kind == "Deployment" and .name == "guestbook-ui" and .owner == "ArgoCD")] | length == 1' "$RUNNER_TEMP/argo-ownership.json"

      - name: Helm 4 and Helm 3 ownership on a real install
        run: bash scripts/ci/helm-lane.sh ./cub-scout "$RUNNER_TEMP/helm-lane"

      - name: kro ownership on a real install
        run: bash scripts/ci/kro-lane.sh ./cub-scout "$RUNNER_TEMP/kro-lane"

      - name: Crossplane ownership on a real install
        run: bash scripts/ci/crossplane-lane.sh ./cub-scout "$RUNNER_TEMP/crossplane-lane"

      - name: Terraform's Kubernetes provider on a real install
        run: bash scripts/ci/terraform-lane.sh ./cub-scout "$RUNNER_TEMP/terraform-lane"

      - name: release check answers on a real Flux OCI delivery
        run: bash scripts/ci/release-check-lane.sh ./cub-scout "$RUNNER_TEMP/release-check-lane"

      - name: landed answers on real Flux and Argo CD deliveries
        run: bash scripts/ci/landed-lane.sh ./cub-scout "$RUNNER_TEMP/landed-lane"

      - name: Record scoped controller acceptance
        run: |
          kubectl get applications.argoproj.io guestbook -n argocd -o json > "$RUNNER_TEMP/argo-application.json"
          kubectl get gitrepositories.source.toolkit.fluxcd.io,kustomizations.kustomize.toolkit.fluxcd.io -n boutique -o json > "$RUNNER_TEMP/flux-delivery.json"

      - name: Retain controller acceptance observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitops-acceptance
          path: |
            ${{ runner.temp }}/flux-ownership.json
            ${{ runner.temp }}/argo-ownership.json
            ${{ runner.temp }}/argo-application.json
            ${{ runner.temp }}/argo-delivery-tree.json
            ${{ runner.temp }}/scout-delivery-tree.json
            ${{ runner.temp }}/scout-delivery-tree-summary.json
            ${{ runner.temp }}/scout-delivery-tree.md
            ${{ runner.temp }}/scout-delivery-tree-deployments.txt
            ${{ runner.temp }}/flux-delivery.json
            ${{ runner.temp }}/scout-controllers/flux-version.txt
            ${{ runner.temp }}/helm-lane/
            ${{ runner.temp }}/kro-lane/
            ${{ runner.temp }}/crossplane-lane/
            ${{ runner.temp }}/terraform-lane/
            ${{ runner.temp }}/release-check-lane/
            ${{ runner.temp }}/landed-lane/

      - name: Test trace command
        run: ./cub-scout trace deployment/cart -n boutique

      - name: Test deep-dive
        run: ./cub-scout map deep-dive | head -80

      - name: Test app-hierarchy
        run: ./cub-scout map app-hierarchy | head -80

  # ==========================================================================
  # Level 4: Demos (optional, manual trigger)
  # ==========================================================================
  demos:
    name: Demo Tests
    runs-on: ubuntu-26.04
    needs: gitops
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'demos' || github.event.inputs.level == 'full'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: demo-cluster

      - name: Install pinned GitOps controllers
        run: bash scripts/ci/setup-gitops-controllers.sh

      - name: Run quick demo
        run: |
          kubectl apply -f test/atk/fixtures/flux-basic.yaml -f test/atk/fixtures/argo-basic.yaml
          ./cub-scout quickstart demo quick --kube-context kind-demo-cluster
          ./cub-scout map list --json | jq -e 'length > 0'
          ./cub-scout quickstart demo quick --kube-context kind-demo-cluster --cleanup

      # The scanner demos (`ccve` and the `bigbank-incident` scenario) are not
      # run here: the scanner is a private release, and this repository holds
      # no credential to fetch it (run 43869520475). Taken out on 2026-11-16.
      - name: Run query demo
        run: |
          kubectl apply -f examples/demos/multi-cluster.yaml
          ./cub-scout quickstart demo query --kube-context kind-demo-cluster
          ./cub-scout map list -q 'kind=Deployment AND owner!=Native' --json | jq -e 'length > 0'
          ./cub-scout quickstart demo query --kube-context kind-demo-cluster --cleanup

      - name: Run scenarios
        run: |
          kubectl apply -f examples/demos/break-glass.yaml
          ./cub-scout quickstart demo scenario break-glass --kube-context kind-demo-cluster
          ./cub-scout quickstart demo scenario break-glass --kube-context kind-demo-cluster --cleanup

  # ==========================================================================
  # Level 6: Connected E2E (needs ConfigHub auth, manual trigger)
  # ==========================================================================
  connected:
    name: Connected E2E
    runs-on: ubuntu-26.04
    needs: integration
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.level == 'connected' || github.event.inputs.level == 'full')
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: connected-cluster

      - name: Provision authenticated disposable ConfigHub
        run: bash scripts/ci/setup-connected-server.sh "$RUNNER_TEMP/scout-connected"

      - name: Run import dry-run tests
        run: go test -tags=integration ./test/integration/... -run 'TestImportDryRun' -v -timeout 120s

      - name: Run import round-trip tests
        run: |
          go test -tags=integration ./test/integration/... -run '^(TestImportFullRoundTrip|TestImportIdempotent|TestImportCleanup)$' -count=1 -json -timeout 300s > "$RUNNER_TEMP/scout-connected/roundtrip.json"
          python3 scripts/ci/require_test_passes.py "$RUNNER_TEMP/scout-connected/roundtrip.json" TestImportFullRoundTrip TestImportIdempotent TestImportCleanup

      # #758: the SDK reader asked the same question as cub, of a real server.
      - name: Compare the SDK reader with cub on the disposable server
        env:
          SCOUT_DISPOSABLE_CONFIGHUB: "1"
          SCOUT_SDK_PARITY_OUT: ${{ runner.temp }}/scout-connected/sdk-parity
        run: |
          go test -tags=integration ./test/integration/... -run '^(TestSDKReaderMatchesCubOnARealServer|TestSDKReaderMatchesCubOnReleasesResourcesAndEvents|TestSDKReaderMatchesCubOnEntitiesAndData|TestSDKReaderMatchesCubOnTheSessionAndAcrossSpaces|TestRecordReleaseLiveStatusOnARealServer|TestRecordViewShapesOnARealServer)$' -count=1 -json -timeout 300s > "$RUNNER_TEMP/scout-connected/sdk-parity.json"
          python3 scripts/ci/require_test_passes.py "$RUNNER_TEMP/scout-connected/sdk-parity.json" TestSDKReaderMatchesCubOnARealServer TestSDKReaderMatchesCubOnReleasesResourcesAndEvents TestSDKReaderMatchesCubOnEntitiesAndData TestSDKReaderMatchesCubOnTheSessionAndAcrossSpaces TestRecordReleaseLiveStatusOnARealServer TestRecordViewShapesOnARealServer

      - name: Retain connected test outcomes and versions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-acceptance
          path: |
            ${{ runner.temp }}/scout-connected/roundtrip.json
            ${{ runner.temp }}/scout-connected/sdk-parity.json
            ${{ runner.temp }}/scout-connected/sdk-parity/
            ${{ runner.temp }}/scout-connected/version.txt

      - name: Remove disposable ConfigHub server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/scout-connected/owns-server-cluster" ]]; then
            kind delete cluster --name scout-ci-connected-server
          fi

  # ==========================================================================
  # Live status (#887): a cluster attached with `cub cluster up`, manual trigger
  # ==========================================================================
  live-status:
    name: Live Status Proof (${{ matrix.controller }})
    # On 26.04, as every other job. This lane is the only one with three
    # kind clusters on a runner, and 26.04 allows 128 inotify instances where
    # 24.04 allowed 1280: the controllers' pods never became available
    # (runs 43832297994, 43932282400). The step below raises the limits;
    # with it the lane passes on 26.04 (run 43936175444).
    runs-on: ubuntu-26.04
    needs: integration
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'live-status'
    strategy:
      fail-fast: false
      matrix:
        controller: [flux, argo, sveltos]
    steps:
      - uses: actions/checkout@v6

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      # 24.04's values. host.txt in the artifact records the limits each run had.
      - name: Raise inotify limits for three kind clusters
        run: sudo sysctl -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: connected-cluster

      - name: Provision authenticated disposable ConfigHub
        run: bash scripts/ci/setup-connected-server.sh "$RUNNER_TEMP/scout-connected"

      - name: Attach a cluster and compare the recorded live status with it
        run: bash scripts/ci/live-status-proof.sh "$RUNNER_TEMP/scout-connected" "$RUNNER_TEMP/scout-live-status" "$PWD/cub-scout" '${{ matrix.controller }}'

      - name: Retain what was read
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-status-proof-${{ matrix.controller }}
          path: |
            ${{ runner.temp }}/scout-live-status/
            ${{ runner.temp }}/scout-connected/version.txt

      - name: Remove the attached cluster and the disposable server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/scout-connected/live-status/owns-live-cluster" ]]; then
            kind delete cluster --name scout-live || true
          fi
          if [[ -f "$RUNNER_TEMP/scout-connected/owns-server-cluster" ]]; then
            kind delete cluster --name scout-ci-connected-server
          fi

  # ==========================================================================
  # Proof artifact (always publish run matrix)
  # ==========================================================================
  proof-artifact:
    name: Proof Artifact
    runs-on: ubuntu-26.04
    needs:
      - unit
      - integration
      - gitops
      - demos
      - connected
      - full
    if: always()
    steps:
      - uses: actions/checkout@v6

      - name: Emit proof artifact
        run: ./scripts/ci/emit-proof-artifact.sh ./proof-artifact
        env:
          PROOF_UNIT: ${{ needs.unit.result }}
          PROOF_INTEGRATION: ${{ needs.integration.result }}
          PROOF_GITOPS: ${{ needs.gitops.result }}
          PROOF_DEMOS: ${{ needs.demos.result }}
          PROOF_CONNECTED: ${{ needs.connected.result }}
          PROOF_FULL: ${{ needs.full.result }}
          PROOF_COVERAGE_TOTAL: ${{ needs.unit.outputs.coverage_total }}
          PROOF_COVERAGE_MIN: ${{ needs.unit.outputs.coverage_min }}

      - name: Upload proof artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-proof-artifact
          path: ./proof-artifact

  # ==========================================================================
  # Modelplane on a control plane only, manual trigger (maintainer's choice,
  # 2026-11-18): Crossplane and the Modelplane Configuration on one kind
  # cluster, no workload cluster, no model.
  # ==========================================================================
  modelplane:
    name: Modelplane Control Plane
    runs-on: ubuntu-26.04
    needs: integration
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'modelplane'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: modelplane

      - name: Install Modelplane and record what it writes
        run: bash scripts/ci/modelplane-lane.sh "$PWD/cub-scout" "$RUNNER_TEMP/modelplane-lane"

      - name: Retain what was read
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modelplane-lane
          path: ${{ runner.temp }}/modelplane-lane/

  # ==========================================================================
  # Attach (#888): a brownfield cluster recorded before and after a real
  # `cub cluster attach`, manual trigger
  # ==========================================================================
  attach:
    name: Attach Recording (${{ matrix.controller }})
    runs-on: ubuntu-26.04
    needs: integration
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'attach'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        controller: [argo, flux, sveltos]
    steps:
      - uses: actions/checkout@v6

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      # Two kind clusters, as in the live lane.
      - name: Raise inotify limits for two kind clusters
        run: sudo sysctl -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: brownfield

      - name: Install pinned GitOps controllers
        run: bash scripts/ci/setup-gitops-controllers.sh

      - name: Provision authenticated disposable ConfigHub
        run: bash scripts/ci/setup-connected-server.sh "$RUNNER_TEMP/scout-connected"

      - name: Record the cluster before and after attach
        run: bash scripts/ci/attach-lane.sh "$RUNNER_TEMP/scout-connected" "$RUNNER_TEMP/attach-lane" "$PWD/cub-scout" brownfield '${{ matrix.controller }}'

      - name: Retain what was read
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attach-lane-${{ matrix.controller }}
          path: |
            ${{ runner.temp }}/attach-lane/
            ${{ runner.temp }}/scout-connected/version.txt

      - name: Remove the disposable server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/scout-connected/owns-server-cluster" ]]; then
            kind delete cluster --name scout-ci-connected-server
          fi

  # ==========================================================================
  # Full test (manual trigger only)
  # ==========================================================================
  full:
    name: Full Verification
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'full'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: full-test-cluster

      - name: Provision required scanner
        run: bash scripts/ci/setup-scan-provider.sh
        env:
          CUB_SCAN_RELEASE_TOKEN: ${{ secrets.CUB_SCAN_RELEASE_TOKEN }}

      - name: Install pinned GitOps controllers
        run: bash scripts/ci/setup-gitops-controllers.sh

      - name: Provision authenticated disposable ConfigHub
        run: bash scripts/ci/setup-connected-server.sh "$RUNNER_TEMP/scout-connected"

      - name: Run prove-it-works
        run: ./test/prove-it-works.sh --level=full

      - name: Remove disposable ConfigHub server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/scout-connected/owns-server-cluster" ]]; then
            kind delete cluster --name scout-ci-connected-server
          fi
