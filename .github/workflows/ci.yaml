# CI Workflow for cub-scout
#
# Runs tests at multiple levels:
# - Level 0 (smoke): Always runs, fast
# - Level 1 (unit): Always runs, all Go tests
# - Level 2 (integration): Needs cluster, basic commands
# - Level 3 (gitops): Needs Flux + ArgoCD, ownership detection
# - Level 6 (connected): Needs ConfigHub auth, import round-trip
#
# See test/test-levels.yaml for level definitions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: 'Test level (smoke, unit, integration, gitops, demos, connected, full)'
        type: choice
        options: [smoke, unit, integration, gitops, demos, connected, full]
        required: false
        default: 'integration'

jobs:
  # ==========================================================================
  # Level 0 + 1: Smoke + Unit (no cluster needed)
  # ==========================================================================
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    outputs:
      coverage_total: ${{ steps.coverage_metric.outputs.coverage_total }}
      coverage_min: ${{ steps.coverage_metric.outputs.coverage_min }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Run golangci-lint
        # Pinned to action @v6 paired with golangci-lint v1.64.8 because the
        # repo's .golangci.yml is still v1 schema. golangci-lint-action @v7+
        # only supports golangci-lint v2.x, which requires a config-schema
        # migration. When .golangci.yml is migrated, bump both back to the
        # current major.
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      - name: Run govulncheck
        continue-on-error: true  # Informational for now - stdlib vulns need Go upgrade
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Check read-only policy
        run: ./scripts/check-readonly.sh

      - name: Check CLI guide parity
        run: ./scripts/check-cli-guide-parity.sh

      - name: Check no personal names in committed files
        run: ./scripts/check-no-personal-names.sh

      - name: Verify genuine governance capture packet
        run: python3 scripts/ci/test_governance_capture.py

      - name: Test required acceptance control flow
        run: python3 scripts/ci/test_prove_it_works.py

      - name: Test connected CI provisioning and required outcomes
        run: python3 scripts/ci/test_connected_ci.py

      - name: Run offline eval trace admission tests
        run: python3 evals/scripts/test_admission_audit.py

      - name: Run offline direct CLI control guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/direct-cli-controls -v

      - name: Run combined recorded runtime receipt contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/combined-recorded-runtime -v

      - name: Run offline HLT-04 replay guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/sveltos-hlt-04-report-freshness -p 'test_*.py' -v

      - name: Run offline RUL-04 capture guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest evals/rul04-image-identity/test_capture.py

      - name: Run offline doctor scan context proof guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/doctor-scan-context -p 'test_*.py' -v

      - name: Run Trace MCP recorded evidence guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/trace-context-binding -p 'test_*.py' -v

      - name: Run offline Trace owned context proof guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/trace-context-live -p 'test_*.py' -v

      - name: Run offline three-way owned context proof guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/three-way-context-live -p 'test_*.py' -v

      - name: Run Trace case-sensitive identity fixture guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/trace-case-sensitive-slugs -p 'test_*.py' -v

      - name: Run offline watch cache namespace proof guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest evals/watch-cache-namespace/test_capture.py -v

      - name: Run offline RUL-01 dated-snapshot guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/rul01-dated-snapshot -v

      - name: Run offline PRE-01 capture guards
        run: |
          python3 -m venv /tmp/scout-pre01-ci
          /tmp/scout-pre01-ci/bin/python -m pip install -r evals/pre01-crd/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/pre01-crd -v

      - name: Run offline full-24 paired source preflight guards
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/full24-pair-preflight -v

      - name: Run offline full-24 selected-case staging guards
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/full24-case-stage -v

      - name: Run offline full-24 case isolation runtime guards
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/full24-case-isolation -v

      - name: Check offline workflow selection
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s scripts/ci -p 'test_offline_workflow.py' -v

      - name: Run offline source-bound launch policy guards
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/full24-launch-policy -v

      - name: Run offline Explain explicit-context answer controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/explain-explicit-context -v

      - name: Run offline ChangeOrder read-contract answer controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/changeorder-read-contract -v

      - name: Run existing strict recorded-scale answer controls
        run: PYTHONDONTWRITEBYTECODE=1 /tmp/scout-pre01-ci/bin/python -m unittest discover -s evals/recorded-scale -p 'test_packet.py' -k test_strict_answer_contract_is_opt_in_and_hashes_generated_files -v

      - name: Run offline PRE-01 recorded API replay guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/recorded-api -v

      - name: Run offline recorded typed-list answer controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/recorded-typed-list -v

      - name: Run offline Sveltos controller-fact answer controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/sveltos-controller-facts -v

      - name: Run offline PRE-01 real-kubectl gate guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/pre01-real-kubectl -v

      - name: Run offline Linux runtime version gate guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest evals/linux-runtime-versions/test_prepare.py

      - name: Run offline RUL-03 capture and fixture-routing guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/rul03-context -v

      - name: Run offline legacy strict-answer packet guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/legacy-strict-cases -v

      - name: Run offline PRE-02 capture and fixture-routing guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/pre02-node-selector -v

      - name: Run offline container isolation guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s evals/container-isolation -v

      - name: Run unit tests
        run: go test ./... -v -covermode=atomic -coverprofile=coverage.out

      - name: Enforce coverage gate
        run: ./scripts/ci/check-coverage.sh coverage.out
        env:
          COVERAGE_MIN_PERCENT: "25.0"

      - name: Capture coverage metric
        id: coverage_metric
        run: |
          total="$(awk '/^total:/{gsub("%","",$3); print $3}' coverage-summary.txt)"
          if [[ -z "${total}" ]]; then
            echo "failed to extract total coverage from coverage-summary.txt" >&2
            exit 1
          fi
          echo "coverage_total=${total}" >> "$GITHUB_OUTPUT"
          echo "coverage_min=25.0" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-summary.txt

      - name: Verify real examples catalog
        run: go test -tags=integration ./test/integration/... -run '^TestRealExamplesCatalog$' -count=1 -v

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cub-scout-linux
          path: cub-scout

  # ==========================================================================
  # Level 2: Integration (needs cluster)
  # ==========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    # Manual smoke/unit runs must not create a cluster. Unknown manual levels
    # also fail closed to offline jobs. Normal PR/main runs retain live CI.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.level == 'integration' || github.event.inputs.level == 'gitops' || github.event.inputs.level == 'demos' || github.event.inputs.level == 'connected' || github.event.inputs.level == 'full'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster

      - name: Build binary for golden tests
        run: go build ./cmd/cub-scout

      - name: Run integration tests
        run: go test -tags=integration ./test/integration/... -v

      - name: Run E2E tests (internal model + cluster)
        run: go test -tags=e2e ./cmd/cub-scout/... -v -timeout 180s

      - name: Run cluster-dependent golden tests
        run: go test -tags=integration ./test/golden/... -count=1 -v

      - name: Test map commands
        run: |
          map_status_exit=0
          ./cub-scout map status || map_status_exit=$?
          if [ "$map_status_exit" -gt 1 ]; then
            echo "map status failed with unexpected exit code $map_status_exit"
            exit "$map_status_exit"
          fi
          ./cub-scout map list
          ./cub-scout map list --json | head -20
          ./cub-scout scan

  # ==========================================================================
  # Level 3: GitOps E2E (needs Flux + ArgoCD)
  # ==========================================================================
  gitops:
    name: GitOps E2E
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: gitops-cluster

      - name: Install pinned GitOps controllers
        run: bash scripts/ci/setup-gitops-controllers.sh

      - name: Deploy Flux example
        run: |
          kubectl apply -f examples/flux-boutique/boutique.yaml
          kubectl wait --for=condition=Ready gitrepository/boutique -n boutique --timeout=300s
          for name in frontend cart checkout payment shipping; do
            kubectl wait --for=condition=Ready "kustomization/$name" -n boutique --timeout=300s
            kubectl rollout status "deployment/$name" -n boutique --timeout=300s
          done

      - name: Deploy ArgoCD example
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: guestbook
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/argoproj/argocd-example-apps.git
              targetRevision: HEAD
              path: guestbook
            destination:
              server: https://kubernetes.default.svc
              namespace: guestbook
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
          EOF
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced application/guestbook -n argocd --timeout=300s
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy application/guestbook -n argocd --timeout=300s
          kubectl rollout status deployment/guestbook-ui -n guestbook --timeout=300s

      - name: Verify Flux ownership detection
        run: |
          ./cub-scout map list --json -n boutique > "$RUNNER_TEMP/flux-ownership.json"
          for name in frontend cart checkout payment shipping; do
            jq -e --arg name "$name" '[.[] | select(.namespace == "boutique" and .kind == "Deployment" and .name == $name and .owner == "Flux")] | length == 1' "$RUNNER_TEMP/flux-ownership.json"
          done
          ./cub-scout map deployers

      - name: Verify ArgoCD ownership detection
        run: |
          ./cub-scout map list --json -n guestbook > "$RUNNER_TEMP/argo-ownership.json"
          jq -e '[.[] | select(.namespace == "guestbook" and .kind == "Deployment" and .name == "guestbook-ui" and .owner == "ArgoCD")] | length == 1' "$RUNNER_TEMP/argo-ownership.json"

      - name: Record scoped controller acceptance
        run: |
          kubectl get applications.argoproj.io guestbook -n argocd -o json > "$RUNNER_TEMP/argo-application.json"
          kubectl get gitrepositories.source.toolkit.fluxcd.io,kustomizations.kustomize.toolkit.fluxcd.io -n boutique -o json > "$RUNNER_TEMP/flux-delivery.json"

      - name: Retain controller acceptance observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitops-acceptance
          path: |
            ${{ runner.temp }}/flux-ownership.json
            ${{ runner.temp }}/argo-ownership.json
            ${{ runner.temp }}/argo-application.json
            ${{ runner.temp }}/flux-delivery.json
            ${{ runner.temp }}/scout-controllers/flux-version.txt

      - name: Test trace command
        run: ./cub-scout trace deployment/cart -n boutique

      - name: Test deep-dive
        run: ./cub-scout map deep-dive | head -80

      - name: Test app-hierarchy
        run: ./cub-scout map app-hierarchy | head -80

  # ==========================================================================
  # Level 4: Demos (optional, manual trigger)
  # ==========================================================================
  demos:
    name: Demo Tests
    runs-on: ubuntu-latest
    needs: gitops
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'demos' || github.event.inputs.level == 'full'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: demo-cluster

      - name: Install pinned GitOps controllers
        run: bash scripts/ci/setup-gitops-controllers.sh

      - name: Run quick demo
        run: |
          kubectl apply -f test/atk/fixtures/flux-basic.yaml -f test/atk/fixtures/argo-basic.yaml
          ./cub-scout quickstart demo quick
          ./cub-scout map list --json | jq -e 'length > 0'
          ./cub-scout quickstart demo quick --cleanup

      - name: Run ccve demo
        run: |
          kubectl apply -f examples/impressive-demo/bad-configs/monitoring-bad.yaml
          ./cub-scout quickstart demo ccve
          ./cub-scout quickstart demo ccve --cleanup

      - name: Run query demo
        run: |
          kubectl apply -f examples/demos/multi-cluster.yaml
          ./cub-scout quickstart demo query
          ./cub-scout map list -q 'kind=Deployment AND owner!=Native' --json | jq -e 'length > 0'
          ./cub-scout quickstart demo query --cleanup

      - name: Run scenarios
        run: |
          kubectl apply -f examples/impressive-demo/bad-configs/monitoring-bad.yaml
          ./cub-scout quickstart demo scenario bigbank-incident
          ./cub-scout quickstart demo scenario bigbank-incident --cleanup
          kubectl apply -f examples/demos/break-glass.yaml
          ./cub-scout quickstart demo scenario break-glass
          ./cub-scout quickstart demo scenario break-glass --cleanup

  # ==========================================================================
  # Level 6: Connected E2E (needs ConfigHub auth, manual trigger)
  # ==========================================================================
  connected:
    name: Connected E2E
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.level == 'connected' || github.event.inputs.level == 'full')
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cub-scout-linux

      - name: Make binary executable
        run: chmod +x cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: connected-cluster

      - name: Provision authenticated disposable ConfigHub
        run: bash scripts/ci/setup-connected-server.sh "$RUNNER_TEMP/scout-connected"

      - name: Run import dry-run tests
        run: go test -tags=integration ./test/integration/... -run 'TestImportDryRun' -v -timeout 120s

      - name: Run import round-trip tests
        run: |
          go test -tags=integration ./test/integration/... -run '^(TestImportFullRoundTrip|TestImportIdempotent|TestImportCleanup)$' -count=1 -json -timeout 300s > "$RUNNER_TEMP/scout-connected/roundtrip.json"
          python3 scripts/ci/require_test_passes.py "$RUNNER_TEMP/scout-connected/roundtrip.json" TestImportFullRoundTrip TestImportIdempotent TestImportCleanup

      - name: Retain connected test outcomes and versions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-acceptance
          path: |
            ${{ runner.temp }}/scout-connected/roundtrip.json
            ${{ runner.temp }}/scout-connected/version.txt

      - name: Remove disposable ConfigHub server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/scout-connected/owns-server-cluster" ]]; then
            kind delete cluster --name scout-ci-connected-server
          fi

  # ==========================================================================
  # Proof artifact (always publish run matrix)
  # ==========================================================================
  proof-artifact:
    name: Proof Artifact
    runs-on: ubuntu-latest
    needs:
      - unit
      - integration
      - gitops
      - demos
      - connected
      - full
    if: always()
    steps:
      - uses: actions/checkout@v6

      - name: Emit proof artifact
        run: ./scripts/ci/emit-proof-artifact.sh ./proof-artifact
        env:
          PROOF_UNIT: ${{ needs.unit.result }}
          PROOF_INTEGRATION: ${{ needs.integration.result }}
          PROOF_GITOPS: ${{ needs.gitops.result }}
          PROOF_DEMOS: ${{ needs.demos.result }}
          PROOF_CONNECTED: ${{ needs.connected.result }}
          PROOF_FULL: ${{ needs.full.result }}
          PROOF_COVERAGE_TOTAL: ${{ needs.unit.outputs.coverage_total }}
          PROOF_COVERAGE_MIN: ${{ needs.unit.outputs.coverage_min }}

      - name: Upload proof artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-proof-artifact
          path: ./proof-artifact

  # ==========================================================================
  # Full test (manual trigger only)
  # ==========================================================================
  full:
    name: Full Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == 'full'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/cub-scout

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: full-test-cluster

      - name: Provision required scanner
        run: bash scripts/ci/setup-scan-provider.sh
        env:
          CUB_SCAN_RELEASE_TOKEN: ${{ secrets.CUB_SCAN_RELEASE_TOKEN }}

      - name: Install pinned GitOps controllers
        run: bash scripts/ci/setup-gitops-controllers.sh

      - name: Provision authenticated disposable ConfigHub
        run: bash scripts/ci/setup-connected-server.sh "$RUNNER_TEMP/scout-connected"

      - name: Run prove-it-works
        run: ./test/prove-it-works.sh --level=full

      - name: Remove disposable ConfigHub server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/scout-connected/owns-server-cluster" ]]; then
            kind delete cluster --name scout-ci-connected-server
          fi
