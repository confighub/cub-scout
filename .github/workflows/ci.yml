name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Read-only contract check
        run: ./scripts/check-readonly.sh

      - name: Full test suite
        run: ./scripts/full-test.sh

      - name: Contract audit (schema immutability + golden determinism)
        run: ./scripts/contract-audit.sh
