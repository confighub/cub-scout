# Release workflow - builds binaries and publishes to GitHub Releases + Homebrew
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary (required for golden tests)
        run: go build ./cmd/cub-scout

      - name: Run tests
        run: go test ./...

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Pin the tag explicitly so GoReleaser's git-describe fallback cannot
          # pick the wrong tag when two tags point at the same commit (e.g. a
          # v2.0.0 stable tag created at the same SHA as v2.0.0-rc5). Without
          # this, GoReleaser re-released rc5 assets and failed with
          # 422 "already_exists" during asset upload.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
