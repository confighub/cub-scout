name: perf

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # weekly

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install benchstat
        # Optional tool: scripts/perf-bench.sh skips the baseline comparison
        # when benchstat is missing, so a failed install must not fail the job.
        # Pinned rather than @latest: setup-go exports GOTOOLCHAIN=local, and
        # x/perf@latest requires a newer Go than the one go.mod selects. This
        # is the newest x/perf revision declaring go 1.24.0; bump it when
        # go.mod's Go version is raised.
        continue-on-error: true
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260209182753-b57e4e371b65
          command -v benchstat

      - name: Run benchmarks
        run: ./scripts/perf-bench.sh

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: perf/out/
