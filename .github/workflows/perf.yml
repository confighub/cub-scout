name: perf

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # weekly

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run benchmarks
        run: ./scripts/perf-bench.sh

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: perf/out/
