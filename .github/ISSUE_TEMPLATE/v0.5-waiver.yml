name: Waiver
description: Request a waiver for a release requirement
labels: ["waiver"]
body:
  - type: markdown
    attributes:
      value: |
        Waivers are exceptional and must be explicit with clear risk ownership.

  - type: input
    id: release_version
    attributes:
      label: Release Version
      description: Which release is this waiver for?
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: Requirement Being Waived
      description: Which rule, test, or expectation is being waived?
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this acceptable for the target release?
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Risk Assessment
      description: What is the worst-case outcome?
    validations:
      required: true

  - type: textarea
    id: mitigation
    attributes:
      label: Mitigation
      description: How is the risk contained?
    validations:
      required: true

  - type: textarea
    id: followup
    attributes:
      label: Follow-Up Work
      description: Link or describe post-release follow-up.
    validations:
      required: true
