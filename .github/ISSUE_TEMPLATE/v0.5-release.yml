name: Release gate
description: Track final go/no-go decision for an upcoming release
labels: ["release"]
body:
  - type: markdown
    attributes:
      value: |
        Use this issue to document the release decision based on evidence.

  - type: input
    id: release_version
    attributes:
      label: Release Version
      description: Which release is being gated?
      placeholder: v1.0.0
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Release Checklist
      options:
        - label: Ownership correctness verified
        - label: Failure modeling verified
        - label: TUI and CLI behavior verified
        - label: CLI contract and docs verified
        - label: Known limitations documented
        - label: Waivers reviewed and approved

  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: GO or NO-GO, with justification and links to evidence.
    validations:
      required: true
