name: Bug report
description: Report a bug affecting current cub-scout releases
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include concrete evidence so we can reproduce quickly.

  - type: input
    id: version
    attributes:
      label: cub-scout Version
      description: Output of `cub-scout version`
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Why does this matter for current releases?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, cluster details, files, or commands.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety Assessment
      description: Could this create misleading output, false certainty, or unsafe guidance?
    validations:
      required: true
