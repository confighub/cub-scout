apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xlaneapps.lane.example.org
spec:
  compositeTypeRef:
    apiVersion: lane.example.org/v1
    kind: XLaneApp
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: deployment
            base:
              apiVersion: apps/v1
              kind: Deployment
              spec:
                replicas: 0
                selector:
                  matchLabels:
                    app: xp-lane
                template:
                  metadata:
                    labels:
                      app: xp-lane
                  spec:
                    containers:
                      - name: pause
                        image: registry.k8s.io/pause:3.10
