# CRD with deprecated version stored in status.storedVersions.
# Used for testing status-dependent scan rules (regression test for #348).
#
# Known issues in this file:
# 1. CCVE-2025-0184: CRD has deprecated stored version - critical
#
# This test verifies that scan rules can access status fields.
# If status is stripped during export, this pattern would NOT fire.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
    - name: v1beta1
      served: false
      storage: false
      deprecated: true
      deprecationWarning: "v1beta1 is deprecated; use v1"
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
# Status block is REQUIRED for the pattern to fire.
# This tests that status is preserved through the scan path (#348).
status:
  acceptedNames:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  conditions:
    - type: Established
      status: "True"
    - type: NamesAccepted
      status: "True"
  # This is the key field - storedVersions contains the deprecated v1beta1
  storedVersions:
    - v1
    - v1beta1
