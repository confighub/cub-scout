# Flux OCI pipeline - source auth failure
# OCIRepository cannot authenticate to registry
---
apiVersion: v1
kind: Namespace
metadata:
  name: delegated-flux-auth-fail
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: private-manifests
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/acme/private-manifests
  ref:
    tag: v1.0.0
  secretRef:
    name: ghcr-credentials
status:
  conditions:
    - type: Ready
      status: "False"
      reason: AuthenticationFailed
      message: "failed to login to OCI registry 'ghcr.io': GET https://ghcr.io/v2/: UNAUTHORIZED: authentication required"
      lastTransitionTime: "2026-02-03T10:00:00Z"
    - type: FetchFailed
      status: "True"
      reason: AuthenticationFailed
      message: "failed to login to OCI registry 'ghcr.io': GET https://ghcr.io/v2/: UNAUTHORIZED: authentication required"
      lastTransitionTime: "2026-02-03T10:00:00Z"
  observedGeneration: 1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: private-app
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: OCIRepository
    name: private-manifests
    namespace: flux-system
  path: ./deploy
  targetNamespace: delegated-flux-auth-fail
  prune: true
status:
  conditions:
    - type: Ready
      status: "False"
      reason: ArtifactFailed
      message: "Source 'OCIRepository/flux-system/private-manifests' is not ready, artifact not found"
      lastTransitionTime: "2026-02-03T10:01:00Z"
  observedGeneration: 1
