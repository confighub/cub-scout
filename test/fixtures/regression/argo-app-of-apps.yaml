apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    cub-scout.io/regression-suite: argo-hierarchy
---
apiVersion: v1
kind: Namespace
metadata:
  name: regression-payments-dev
  labels:
    cub-scout.io/regression-suite: argo-hierarchy
---
apiVersion: v1
kind: Namespace
metadata:
  name: regression-payments-prod
  labels:
    cub-scout.io/regression-suite: argo-hierarchy
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  labels:
    cub-scout.io/regression-suite: argo-hierarchy
spec:
  project: default
  source:
    repoURL: https://git.example.local/platform.git
    targetRevision: main
    path: argo/app-of-apps/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
status:
  sync:
    status: Synced
    revision: abcdef123456
  health:
    status: Healthy
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-root
    cub-scout.io/regression-suite: argo-hierarchy
  annotations:
    cub-scout.io/parent-application: platform-root
spec:
  project: default
  source:
    repoURL: https://git.example.local/platform.git
    targetRevision: main
    path: argo/app-of-apps/apps/payments-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: regression-payments-dev
status:
  sync:
    status: Synced
    revision: bcdefa123456
  health:
    status: Healthy
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-root
    cub-scout.io/regression-suite: argo-hierarchy
  annotations:
    cub-scout.io/parent-application: platform-root
spec:
  project: default
  source:
    repoURL: https://git.example.local/platform.git
    targetRevision: main
    path: argo/app-of-apps/apps/payments-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: regression-payments-prod
status:
  sync:
    status: Synced
    revision: cdefab123456
  health:
    status: Healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: regression-payments-dev
  labels:
    app: payments-api
    argocd.argoproj.io/instance: payments-dev
    cub-scout.io/regression-suite: argo-hierarchy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        argocd.argoproj.io/instance: payments-dev
        cub-scout.io/regression-suite: argo-hierarchy
    spec:
      containers:
        - name: api
          image: registry.k8s.io/pause:3.9
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: regression-payments-prod
  labels:
    app: payments-api
    argocd.argoproj.io/instance: payments-prod
    cub-scout.io/regression-suite: argo-hierarchy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        argocd.argoproj.io/instance: payments-prod
        cub-scout.io/regression-suite: argo-hierarchy
    spec:
      containers:
        - name: api
          image: registry.k8s.io/pause:3.9
