# Bridge fixture: Git → Flux delivery chain
# GitRepository → Kustomization → 2 Deployments with Flux labels
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app-repo
  namespace: flux-system
spec:
  url: https://github.com/org/app-repo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-apps
  namespace: flux-system
spec:
  path: ./deploy
  sourceRef:
    kind: GitRepository
    name: app-repo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: web
  labels:
    kustomize.toolkit.fluxcd.io/name: web-apps
    kustomize.toolkit.fluxcd.io/namespace: flux-system
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: web
  labels:
    kustomize.toolkit.fluxcd.io/name: web-apps
    kustomize.toolkit.fluxcd.io/namespace: flux-system
spec:
  replicas: 3
