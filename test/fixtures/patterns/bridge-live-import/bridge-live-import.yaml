# Bridge fixture: Live import (ConfigHub labels without GitOps deployer)
# Deployment + Service with ConfigHub labels only (no Flux/ArgoCD/Helm labels)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
  namespace: legacy
  labels:
    confighub.com/UnitSlug: legacy-api
    app: legacy-api
spec:
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-api
  namespace: legacy
  labels:
    confighub.com/UnitSlug: legacy-api
    app: legacy-api
spec:
  ports:
    - port: 80
