# Bridge fixture: ConfigHub → OCI delivery chain
# OCIRepository (ConfigHub origin) → Kustomization → Deployment with both Flux + ConfigHub labels
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: confighub-payments
  namespace: flux-system
  labels:
    confighub.com/SpaceName: payments-prod
spec:
  url: oci://registry.confighub.com/spaces/payments-prod
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payments
  namespace: flux-system
spec:
  sourceRef:
    kind: OCIRepository
    name: confighub-payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
  labels:
    kustomize.toolkit.fluxcd.io/name: payments
    kustomize.toolkit.fluxcd.io/namespace: flux-system
    confighub.com/UnitSlug: payments-api
spec:
  replicas: 3
