      - drift-aware rollout confidence
    use_cases:
      - cross-fleet query baseline
      - rollout planning
    demo_scenarios:
      - Security Patch
    required_paths:
      - clusters/dev/kustomization.yaml
      - clusters/prod/kustomization.yaml
      - infrastructure/gitrepository.yaml
