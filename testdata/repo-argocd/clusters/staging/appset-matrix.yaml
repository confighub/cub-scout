apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-apps
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/example/gitops
              revision: HEAD
              directories:
                - path: apps/*
          - list:
              elements:
                - env: dev
                - env: prod
  template:
    metadata:
      name: '{{path.basename}}-{{env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/example/gitops
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
