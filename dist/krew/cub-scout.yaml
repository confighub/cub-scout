apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cub-scout
spec:
  version: v3.0.0
  homepage: https://github.com/confighub/cub-scout
  shortDescription: "GitOps explorer for agents: read-only evidence from your clusters"
  description: |
    cub-scout is an offline-first, deterministic, read-only cluster explorer
    for Kubernetes and GitOps. Run it as a kubectl plugin via
    `kubectl cub-scout ...`.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/confighub/cub-scout/releases/download/v3.0.0/cub-scout_3.0.0_linux_amd64.tar.gz
      sha256: a8940f8eeb1b518f5a4cfe20260ded0e92e090c6d924434ed89a83a004e5a598
      bin: kubectl-cub_scout
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/confighub/cub-scout/releases/download/v3.0.0/cub-scout_3.0.0_linux_arm64.tar.gz
      sha256: 2ce82805000d2863f75217701211068e6264f746fdd7c6cb78c1281f4c56679e
      bin: kubectl-cub_scout
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/confighub/cub-scout/releases/download/v3.0.0/cub-scout_3.0.0_darwin_amd64.tar.gz
      sha256: 558b99e407984f043bfcd191ea70f5d0686649360267d5334b66fa390bee4985
      bin: kubectl-cub_scout
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/confighub/cub-scout/releases/download/v3.0.0/cub-scout_3.0.0_darwin_arm64.tar.gz
      sha256: a662b1af6d311f13fbc859849a28302ef461fe586e210c73465e1d399478830f
      bin: kubectl-cub_scout
