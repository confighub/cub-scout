apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cub-scout
spec:
  version: v3.1.0
  homepage: https://github.com/confighub/cub-scout
  shortDescription: "GitOps explorer for agents: read-only evidence from your clusters"
  description: |
    cub-scout is an offline-first, deterministic, read-only cluster explorer
    for Kubernetes and GitOps. Run it as a kubectl plugin via
    `kubectl cub-scout ...`.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/confighub/cub-scout/releases/download/v3.1.0/cub-scout_3.1.0_linux_amd64.tar.gz
      sha256: 1ebc12ca10c3c91f43e133a5b616305c875e4247eaa66f94127a5243e63d5b6f
      bin: kubectl-cub_scout
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/confighub/cub-scout/releases/download/v3.1.0/cub-scout_3.1.0_linux_arm64.tar.gz
      sha256: ee788db58b2c7dd87c0a62502856077726e72101bbc31c647307579c15a474e0
      bin: kubectl-cub_scout
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/confighub/cub-scout/releases/download/v3.1.0/cub-scout_3.1.0_darwin_amd64.tar.gz
      sha256: 4b0432418c921a73f07bd16dd68c74fc317c0bc02681c3722b7673ea7a6fef7a
      bin: kubectl-cub_scout
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/confighub/cub-scout/releases/download/v3.1.0/cub-scout_3.1.0_darwin_arm64.tar.gz
      sha256: 19c2dbcaeb254f5186de9c880459afaf06772648c03e582c3156e041f40c56c4
      bin: kubectl-cub_scout
